abilities.focus.title=SOUL & FOCUS
abilities.focus.desc=Strike enemies with your Nail to gather Soul. Hold the Focus key while standing still to spend Soul and heal your shell one mask at a time.

abilities.fireball.title=VENGEFUL SPIRIT
abilities.fireball.desc=Spend Soul to launch a powerful fireball horizontally in the direction you face. Passes through enemies and deals heavy damage to anything in its path.

abilities.dash.title=MOTHWING CLOAK
abilities.dash.desc=Propel yourself forward in an instant to cross gaps, dodge attacks and reposition. The dash is purely horizontal and briefly ignores gravity.

abilities.walljump.title=MANTIS CLAW
abilities.walljump.desc=Press into a wall while airborne to cling to it and slide slowly downward. Jump away from the wall to vault upward and reach higher areas.

abilities.scream.title=HOWLING WRAITHS
abilities.scream.desc=Spend Soul to release a burst of wraith energy directly above you. The explosion lingers briefly and hits airborne enemies multiple times.

