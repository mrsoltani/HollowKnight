charm.name.QUICK_SLASH=Quick Slash
charm.name.QUICK_FOCUS=Quick Focus
charm.name.HEAVY_BLOW=Heavy Blow
charm.name.SHARP_SHADOW=Sharp Shadow
charm.name.VOID_HEART=Void Heart

# Charms Descriptions
charm.desc.SOUL_CATCHER=Increases the amount of Soul gained when striking an enemy with the Nail.
charm.desc.DASHMASTER=Allows the bearer to dash more often.
charm.desc.UNBREAKABLE_STRENGTH=Strengthens the bearer, increasing the damage dealt to enemies with the Nail.
charm.desc.QUICK_SLASH=Significantly increases the bearer's attack speed with the Nail and reduces cooldown between strikes.
charm.desc.QUICK_FOCUS=Increases the speed of focusing Soul, allowing the bearer to heal much faster.
charm.desc.HEAVY_BLOW=Increases the knockback force of Nail strikes, pushing enemies further away when hit.
charm.desc.SHARP_SHADOW=Transforms dashes into a dark shadow that damages enemies and makes the bearer invincible. Increases dash length by 20%.
charm.desc.VOID_HEART=Enhances the bearer's abilities, increasing their damage by 50% and unlocking their dark animated forms.

