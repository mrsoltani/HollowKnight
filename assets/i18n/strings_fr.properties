abilities.focus.title=AME & CONCENTRATION
abilities.focus.desc=Frappez les ennemis avec votre Clou pour accumuler de l'Ame. Maintenez la touche Concentration immobile pour depenser de l'Ame et soigner votre carapace.

abilities.fireball.title=ESPRIT VENGEUR
abilities.fireball.desc=Depensez de l'Ame pour lancer une puissante boule de feu dans votre direction. Elle traverse les ennemis et inflige de lourds degats sur son passage.

abilities.dash.title=MANTEAU DE MIRINTHE
abilities.dash.desc=Propulsez-vous instantanement pour franchir des fosses, esquiver des attaques et vous repositionner. La ruee est purement horizontale et ignore brievement la gravite.

abilities.walljump.title=GRIFFE DE MANTE
abilities.walljump.desc=Appuyez contre un mur en l'air pour vous y accrocher et glisser lentement vers le bas. Sautez du mur pour vous propulser vers le haut.

abilities.scream.title=LAMENTATIONS HURLANTES
abilities.scream.desc=Depensez de l'Ame pour liberer une explosion d'energie directement au-dessus de vous. L'explosion persiste brievement et frappe plusieurs fois les ennemis aeriens.


