# Charms Descriptions
charm.desc.SOUL_CATCHER=Augmente la quantité d'Âme obtenue en frappant un ennemi avec l'Aiguillon.
charm.desc.DASHMASTER=Permet au porteur de ruer plus souvent.
charm.desc.UNBREAKABLE_STRENGTH=Renforce le porteur, augmentant les dégâts infligés aux ennemis avec l'Aiguillon.
charm.desc.QUICK_SLASH=Augmente considérablement la vitesse d'attaque à l'Aiguillon du porteur et réduit le temps de recharge entre les coups.
charm.desc.QUICK_FOCUS=Augmente la vitesse de concentration de l'Âme, permettant au porteur de se soigner beaucoup plus rapidement.
charm.desc.HEAVY_BLOW=Augmente la force de recul des coups d'Aiguillon, repoussant les ennemis plus loin lors de l'impact.
charm.desc.SHARP_SHADOW=Transforme les ruées en une ombre noire infligeant des dégâts aux ennemis et rendant le porteur invincible. Augmente la distance de ruée de 20%.
charm.desc.VOID_HEART=Améliore les capacités du porteur, augmentant leurs dégâts de 50 % et débloquant leurs formes animées sombres.

