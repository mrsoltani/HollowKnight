zote.initial.count=3
zote.initial.1=Oh ! Vous etes de retour ! Vous etes passe devant moi et descendu dans les ruines sans meme dire bonjour ! J'ai cru voir un fantome.
zote.initial.2=Je suis Zote le Puissant ! Manieur de l'Exterminateur de Vie ! Vous feriez bien de retenir ce nom, petite creature. Un jour, il retentira dans tout le royaume !
zote.initial.3=Maintenant, ecartez-vous. J'ai des batailles a livrer et de la gloire a conquerir. Je n'ai besoin de l'aide de personne comme vous.

zote.precept.count=20
zote.precept.1=Precepte Un: 'Gagnez Toujours Vos Batailles'. Perdre une bataille ne vous apporte rien. Gagnez vos batailles, ou ne vous y engagez pas du tout !
zote.precept.2=Precepte Deux: 'Ne Les Laissez Jamais Rire de Vous'. Les idiots rient de tout. Mais le rire n'est pas inoffensif ! Vous devez frapper rapidement a la source de cette joie perverse.
zote.precept.3=Precepte Trois: 'Reposez-Vous Toujours'. Se battre et aventurer epuisent votre corps. Quand vous vous reposez, votre corps se renforce et se repare. Plus vous vous reposez, plus vous devenez fort.
zote.precept.4=Precepte Quatre: 'Oubliez Votre Passe'. Le passe est douloureux. Pensez a autre chose, comme l'avenir, ou de la nourriture.
zote.precept.5=Precepte Cinq: 'La Force Bat la Force'. Votre adversaire est fort ? Peu importe ! Surmontez simplement sa force avec encore plus de force.
zote.precept.6=Precepte Six: 'Choisissez Votre Propre Destin'. Nos anciens enseignent que notre destin est choisi avant notre naissance. Je ne suis pas d'accord.
zote.precept.7=Precepte Sept: 'Ne Pleurez Pas les Morts'. Quand nous mourons, les choses s'ameliorent-elles ou empirent-elles ? Impossible a dire, alors ne vous donnez pas la peine de pleurer.
zote.precept.8=Precepte Huit: 'Voyagez Seul'. Vous ne pouvez compter sur personne. Personne ne sera toujours loyal. Donc, personne devrait etre votre compagnon constant.
zote.precept.9=Precepte Neuf: 'Gardez Votre Maison en Ordre'. Votre maison abrite votre possession la plus precieuse : vous-meme. Faites donc un effort pour la garder propre.
zote.precept.10=Precepte Dix: 'Gardez Votre Arme Aiguisee'. Je m'assure que mon arme, l'Exterminateur de Vie, est toujours bien affilee. Cela facilite grandement la coupe.
zote.precept.11=Precepte Onze: 'Les Meres Vous Trahiront Toujours'. Ce precepte s'explique de lui-meme.
zote.precept.12=Precepte Douze: 'Gardez Votre Manteau Sec'. Si votre manteau est mouille, sechezle des que possible. Porter des manteaux mouilles est desagreable.
zote.precept.13=Precepte Treize: 'N'Ayez Jamais Peur'. La peur ne peut que vous freiner. Donc, ne soyez simplement pas effraye des le depart.
zote.precept.14=Precepte Quatorze: 'Respectez Vos Superieurs'. Si quelqu'un vous est superieur en force ou en intelligence, montrez-lui votre respect.
zote.precept.15=Precepte Quinze: 'Un Ennemi, Un Coup'. Vous ne devriez utiliser qu'un seul coup pour vaincre un ennemi. Tout de plus est du gaspillage.
zote.precept.16=Precepte Seize: 'N'Hesitez Pas'. Une fois que vous avez pris une decision, executez-la et ne regardez pas en arriere.
zote.precept.17=Precepte Dix-Sept: 'Croyez en Votre Force'. Les autres peuvent douter de vous, mais il y a quelqu'un en qui vous pouvez toujours avoir confiance. Vous-meme.
zote.precept.18=Precepte Dix-Huit: 'Cherchez la Verite dans l'Obscurite'. Ce precepte s'explique aussi de lui-meme.
zote.precept.19=Precepte Dix-Neuf: 'Si Vous Essayez, Reussissez'. Si vous allez tenter quelque chose, assurez-vous de le reussir. Si vous ne reussissez pas, vous avez echoue !
zote.precept.20=Precepte Vingt: 'Ne Dites Que la Verite'. Parler veritablement est courtois et efficace. Attention cependant, cela peut vous faire des ennemis.
